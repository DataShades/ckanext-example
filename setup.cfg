[metadata]
name = ckanext-example
version = 0.0.1
description = 
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/DataShades/ckanext-example
author = Sergey Motornyuk
author_email = sergey.motornyuk@linkdigital.com.au
license = AGPL
classifiers =
            Development Status :: 4 - Beta
            License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)
            Programming Language :: Python :: 3.8
            Programming Language :: Python :: 3.9
            Programming Language :: Python :: 3.10
            Programming Language :: Python :: 3.11
            Programming Language :: Python :: 3.12
            Programming Language :: Python :: 3.13
keywords = CKAN

[options]
python_requires = >= 3.8
packages = find:
namespace_packages = ckanext
include_package_data = True
install_requires =
                 typing_extensions

[options.entry_points]
ckan.plugins =
             example = ckanext.example.plugin:ExamplePlugin

babel.extractors =
                 ckan = ckan.lib.extract:extract_ckan

[options.extras_require]
test =
     pytest-ckan
     pytest-benchmark
     pytest-pretty

docs =
     mkdocs
     mkdocs-material
     pymdown-extensions
     mkdocstrings[python]

dev =
    %(test)s
    %(docs)s
    pre-commit

[extract_messages]
keywords = translate isPlural
add_comments = TRANSLATORS:
output_file = ckanext/example/i18n/ckanext-example.pot
width = 80

[init_catalog]
domain = ckanext-example
input_file = ckanext/example/i18n/ckanext-example.pot
output_dir = ckanext/example/i18n

[update_catalog]
domain = ckanext-example
input_file = ckanext/example/i18n/ckanext-example.pot
output_dir = ckanext/example/i18n
previous = true

[compile_catalog]
domain = ckanext-example
directory = ckanext/example/i18n
statistics = true
